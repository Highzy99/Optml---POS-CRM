.tiers { display: grid; gap: 6px; }

.stepper { display: inline-flex; align-items: center; gap: 6px; }
.stepper button { width: 32px; height: 32px; border-radius: 50%; border: 0; background: rgba(255,255,255,.16); color: #fff; font-size: 18px; line-height: 1; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }

.after { margin-top: 44px; padding-top: 28px; border-top: 1px solid var(--n200); display: grid; gap: 18px; }

.flow { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; counter-reset: flow; }
.flow li { counter-increment: flow; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 2px 8px; padding: 14px 0; border-top: 1px solid var(--n200); }
.flow li:first-child { border-top: 0; padding-top: 0; }

@media (min-width: 860px) {
  .after { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 40px; }

}

/* Product page */
.plid { background: var(--g); color: var(--g-ink); border-radius: var(--r-xl); padding: 22px 20px 18px; display: flex; flex-direction: column; gap: 28px; margin-top: 6px; }

.lock img { width: 34px; height: 34px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255,255,255,.7); }
.lock span, .plid-chip { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 14px; border-radius: var(--pill); background: rgba(255,255,255,.88); color: var(--ink); font-size: 14px; font-weight: 600; text-decoration: none; }

.pintro { font-size: 16px; max-width: 62ch; }
.seg.full { display: flex; width: 100%; } .seg.full button { flex: 1; padding: 0 8px; min-height: 40px; font-weight: 600; }
.mixsteps { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
.mixsteps li { display: flex; gap: 14px; padding: 14px 0; border-top: 1px solid var(--n200); }

.mixsteps b { color: var(--ink); }

/* Order page: your box */
.orderbox { background: var(--lid); color: #fff; border-radius: var(--r-xl); padding: clamp(20px, 4vw, 32px); display: flex; flex-direction: column; gap: 20px; }
.orderbox h2 { color: #fff; font-size: clamp(32px, 8vw, 44px); letter-spacing: -.04em; line-height: 1; }
.orderbox .ref { font-size: 13px; font-weight: 600; color: rgba(255,255,255,.8); font-variant-numeric: tabular-nums; }
.ostep { display: flex; gap: 14px; list-style: none; padding: 0; margin: 0; font-size: 13px; font-weight: 500; color: rgba(255,255,255,.75); }
.ostep li { display: flex; align-items: center; gap: 6px; }
.ostep span { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.55); display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
.ostep li.now { color: #fff; font-weight: 700; } .ostep li.now span { background: #fff; color: var(--lid-ink); box-shadow: none; }
.ostep li.done span { background: var(--lid-pill); color: var(--lid-ink); box-shadow: none; }
.oempty p { color: rgba(255,255,255,.9); margin-bottom: 14px; max-width: 40ch; }
.olines { display: flex; flex-direction: column; }
.oline { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px 12px; padding: 14px 0; border-top: 1px solid rgba(255,255,255,.22); }
.oline .on { font-size: 16px; font-weight: 600; }

.oline .stepper { justify-self: end; }

.shipbar .bar { height: 6px; border-radius: 6px; background: rgba(255,255,255,.25); overflow: hidden; margin-top: 8px; }

.linkbtn { background: none; border: 0; color: #fff; text-decoration: underline; text-underline-offset: 3px; font-size: 14px; cursor: pointer; padding: 0; min-height: 32px; }
.odetails { display: flex; flex-direction: column; gap: 16px; margin-top: 28px; }
.odetails .field small { color: var(--bad); font-weight: 600; }
.odetails .btn.block { min-height: 56px; font-size: 17px; font-weight: 700; }
.orderbox .btn.on-dark { color: var(--ink); font-weight: 700; }

.orderbox .input { border-color: transparent; }
.oline .stepper button { width: 30px; height: 30px; }
.osent { display: flex; flex-direction: column; gap: 14px; } .osent p { color: rgba(255,255,255,.92); }
