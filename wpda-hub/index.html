.qa-head h2 { font-size: 22px; letter-spacing: -.02em; line-height: 1.15; }
.qa-x { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--paper); color: var(--ink); font-size: 24px; line-height: 1; cursor: pointer; flex: none; }
.qa-note { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--n700); }
.qa-note img { width: 18px; height: 18px; }
.qa-foot { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 8px; }
.gcard { background: var(--ink); color: #fff; border-radius: var(--r-xl); padding: 28px 24px; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; margin-top: 40px; }
.gcard > img { width: 72px; height: 72px; border-radius: 50%; }
.gcard h2 { color: #fff; font-size: 23px; letter-spacing: -.02em; }
.gcard p { color: rgba(255,255,255,.75); max-width: 52ch; }
@media (min-width: 860px) { .gcard { flex-direction: row; align-items: center; padding: 32px 36px; gap: 24px; } .gcard .stack { flex: 1; } }
.strengths { display: flex; gap: 4px; background: var(--paper); border-radius: var(--pill); padding: 3px; align-self: flex-start; }
.strengths button { position: relative; min-height: 34px; padding: 0 14px; border: 0; border-radius: var(--pill); background: transparent; font-size: 14px; font-weight: 600; color: var(--n600); cursor: pointer; }
.strengths button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(34,35,38,.14); }
.strengths i { position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--ink); }
.tiers { display: grid; gap: 6px; }
.tier { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-height: 68px; padding: 8px 4px; border-radius: var(--r-md); border: 0; background: var(--paper); cursor: pointer; color: var(--ink); text-align: center; transition: background-color .12s ease, transform .1s ease; }
button.tier:hover { background: var(--sunken); }
button.tier:active { transform: scale(.97); }
.tier .tl { font-size: 12.5px; color: var(--n600); font-weight: 500; }
.tier .tp { font-size: 18px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; }
.tier .tn { font-size: 12px; color: var(--n600); min-height: 16px; }
.tier .tn s { color: var(--n500); }
.tier .sv { font-size: 12px; font-weight: 600; color: var(--ok); }
.tier.on { background: var(--ink); color: #fff; cursor: default; gap: 4px; }
.tier.on .tl { color: rgba(255,255,255,.75); }
.stepper { display: inline-flex; align-items: center; gap: 6px; }
.stepper button { width: 32px; height: 32px; border-radius: 50%; border: 0; background: rgba(255,255,255,.16); color: #fff; font-size: 18px; line-height: 1; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.stepper button:hover { background: rgba(255,255,255,.28); }
.stepper b { min-width: 18px; text-align: center; font-size: 16px; font-variant-numeric: tabular-nums; }
.listnote { font-size: 13px; color: var(--n600); margin-top: 14px; max-width: 70ch; }
.after { margin-top: 44px; padding-top: 28px; border-top: 1px solid var(--n200); display: grid; gap: 18px; }
.after h2 { font-size: clamp(24px, 6vw, 32px); letter-spacing: -.03em; }
.flow { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; counter-reset: flow; }
.flow li { counter-increment: flow; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 2px 8px; padding: 14px 0; border-top: 1px solid var(--n200); }
.flow li:first-child { border-top: 0; padding-top: 0; }
.flow li::before { content: counter(flow); grid-row: 1 / span 2; font-size: 26px; font-weight: 700; letter-spacing: -.03em; line-height: 1; color: var(--ink); }
.flow b { color: var(--ink); font-size: 16px; }
.flow span { grid-column: 2; font-size: 14.5px; color: var(--n600); }
@media (min-width: 860px) {
  .after { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 40px; }
  .flow { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; }
  .flow li { border-top: 0; padding: 0; grid-template-columns: minmax(0, 1fr); }
  .flow li::before { grid-row: auto; margin-bottom: 10px; }
  .flow span { grid-column: 1; }
}

/* Product page */
.plid { background: var(--g); color: var(--g-ink); border-radius: var(--r-xl); padding: 22px 20px 18px; display: flex; flex-direction: column; gap: 28px; margin-top: 6px; }
.plid h1 { color: inherit; font-size: clamp(34px, 9.5vw, 56px); letter-spacing: -.04em; line-height: .98; }
.plid h1 span { display: block; font-weight: 400; opacity: .82; }
.plid-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.lock { display: inline-flex; align-items: center; gap: 6px; }
.lock img { width: 34px; height: 34px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255,255,255,.7); }
.lock span, .plid-chip { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 14px; border-radius: var(--pill); background: rgba(255,255,255,.88); color: var(--ink); font-size: 14px; font-weight: 600; text-decoration: none; }
.lock span { text-transform: lowercase; font-size: 15px; }
.plid-chip:hover { background: #fff; }
.plid .strengths { background: rgba(255,255,255,.3); align-self: flex-start; }
.plid .strengths a { display: inline-flex; align-items: center; min-height: 36px; padding: 0 16px; border-radius: var(--pill); font-size: 15px; font-weight: 600; color: inherit; text-decoration: none; }
.plid .strengths a[aria-current="page"] { background: #fff; color: var(--ink); }
.plid-top { display: flex; flex-direction: column; gap: 16px; }
.inbox { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: var(--r-md); background: var(--lid-soft); color: var(--lid-ink); font-size: 14.5px; line-height: 1.4; }
.inbox svg { flex: none; }
.inbox b { font-weight: 700; }
.pintro { font-size: 16px; max-width: 62ch; }
.seg.full { display: flex; width: 100%; } .seg.full button { flex: 1; padding: 0 8px; min-height: 40px; font-weight: 600; }
.mixsteps { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
.mixsteps li { display: flex; gap: 14px; padding: 14px 0; border-top: 1px solid var(--n200); }
.mixsteps li:first-child { border-top: 0; }
.mixsteps .n { width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; }
.mixsteps b { color: var(--ink); }

/* Order page: your box */
.orderbox { background: var(--lid); color: #fff; border-radius: var(--r-xl); padding: clamp(20px, 4vw, 32px); display: flex; flex-direction: column; gap: 20px; }
.orderbox h2 { color: #fff; font-size: clamp(32px, 8vw, 44px); letter-spacing: -.04em; line-height: 1; }
.orderbox .ref { font-size: 13px; font-weight: 600; color: rgba(255,255,255,.8); font-variant-numeric: tabular-nums; }
.ostep { display: flex; gap: 14px; list-style: none; padding: 0; margin: 0; font-size: 13px; font-weight: 500; color: rgba(255,255,255,.75); }
.ostep li { display: flex; align-items: center; gap: 6px; }
.ostep span { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.55); display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
.ostep li.now { color: #fff; font-weight: 700; } .ostep li.now span { background: #fff; color: var(--lid-ink); box-shadow: none; }
.ostep li.done span { background: var(--lid-pill); color: var(--lid-ink); box-shadow: none; }
.oempty p { color: rgba(255,255,255,.9); margin-bottom: 14px; max-width: 40ch; }
.olines { display: flex; flex-direction: column; }
.oline { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px 12px; padding: 14px 0; border-top: 1px solid rgba(255,255,255,.22); }
.oline .on { font-size: 16px; font-weight: 600; }
.oline .op { font-size: 16px; font-weight: 700; text-align: right; }
.oline .ok { font-size: 13.5px; color: rgba(255,255,255,.88); }
.oline .stepper { justify-self: end; }

.shipbar .bar { height: 6px; border-radius: 6px; background: rgba(255,255,255,.25); overflow: hidden; margin-top: 8px; }
.shipbar .bar i { display: block; height: 100%; background: #fff; border-radius: 6px; transition: width .3s cubic-bezier(.2,.7,.2,1); }
.otot { display: flex; flex-direction: column; gap: 8px; }
.otot > div { display: flex; justify-content: space-between; font-size: 15px; color: rgba(255,255,255,.9); }
.otot .grand { font-size: 22px; letter-spacing: -.02em; color: #fff; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.28); }
.planlink { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: var(--r-md); background: rgba(255,255,255,.16); color: #fff; text-decoration: none; font-size: 14.5px; }
.planlink:hover { background: rgba(255,255,255,.24); }
.planlink span { flex: 1; }
.linkbtn { background: none; border: 0; color: #fff; text-decoration: underline; text-underline-offset: 3px; font-size: 14px; cursor: pointer; padding: 0; min-height: 32px; }
.odetails { display: flex; flex-direction: column; gap: 16px; margin-top: 28px; }
.odetails .field small { color: var(--bad); font-weight: 600; }
.odetails .btn.block { min-height: 56px; font-size: 17px; font-weight: 700; }
.orderbox .btn.on-dark { color: var(--ink); font-weight: 700; }
.orderbox .btn.on-dark-outline { border-color: rgba(255,255,255,.6); }
.orderbox .btn.on-dark-outline:hover { background: rgba(255,255,255,.14); }
.orderbox .input { border-color: transparent; }
.oline .stepper button { width: 30px; height: 30px; }
.osent { display: flex; flex-direction: column; gap: 14px; } .osent p { color: rgba(255,255,255,.92); }
.guidecard { background: #fff; color: var(--n700); border-radius: var(--r-lg); padding: 18px; display: flex; flex-direction: column; gap: 8px; }
.osent .guidecard p { color: var(--n700); }
.osent .guidecard .row { margin-top: 6px; }
.btn.disabled { opacity: .45; pointer-events: none; }
.coagrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 0 28px; }
.coacard { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--n200); text-decoration: none; color: inherit; }
.coacard:hover b { text-decoration: underline; text-underline-offset: 3px; }
.coacard img { width: 32px; height: 32px; flex: none; }
.coacard b { color: var(--ink); }
.coacard .pur { font-weight: 700; color: var(--ink); }
footer.foot { margin-top: 56px; }

/* ---------- Export document ---------- */
.doc { display: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; color: #2c2d31; }
.doc.show { display: block; margin-top: 24px; }
.doc .paper { background: var(--white); border: 1px solid var(--n200); border-radius: var(--r-lg); padding: clamp(18px, 4vw, 40px); box-shadow: var(--shadow); }
.doc .dpage + .dpage { margin-top: 40px; padding-top: 40px; border-top: 1px dashed var(--n300); }
.doc h2.dh { font-size: 26px; letter-spacing: -.025em; margin-bottom: 6px; }
.doc h3.dh3 { font-size: 18px; margin: 22px 0 10px; }
.doc .dsub { font-size: 14px; color: var(--n600); margin-bottom: 16px; }
.doc .cover { background: var(--wash); border-radius: 22px; padding: 28px; display: flex; flex-direction: column; gap: 18px; }
.doc .cover h1 { font-size: 40px; letter-spacing: -.035em; line-height: 1; }
.doc .dmeta { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; color: var(--n700); }
.doc .cblock { border: 1px solid var(--n200); border-radius: 16px; padding: 18px; margin-top: 14px; break-inside: avoid; }
.doc .cblock .chead { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
.doc .cblock .chead img, .doc .cblock .chead .av { width: 36px; height: 36px; flex: none; }
.doc .kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 10px 0; }
.doc .kv div { background: var(--paper); border-radius: 10px; padding: 8px 10px; }
.doc .kv dt { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--n600); }
.doc .kv dd { margin: 2px 0 0; font-size: 13px; font-weight: 600; color: var(--ink); }
.doc .tbl { font-size: 13px; }
.doc .tbl th, .doc .tbl td { padding: 7px 9px; }
.doc .checks { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.doc .checks li { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.doc .box { width: 16px; height: 16px; border: 1.5px solid var(--ink); border-radius: 4px; flex: none; margin-top: 2px; display: inline-block; }
.doc .track td.on { background: var(--paper); }
.doc .wkblock { break-inside: avoid; }
.doc .track td { text-align: center; font-size: 12px; }
.doc .track td:first-child { text-align: left; font-weight: 600; }
.doc .track .box { margin: 0 auto 2px; display: block; }
.doc .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.doc .mini { border: 1px solid var(--n200); border-radius: 12px; padding: 12px 14px; break-inside: avoid; }
.doc .mini h4 { font-size: 15px; margin-bottom: 4px; }
.doc .mini p { font-size: 13px; line-height: 1.5; }
.doc .dfoot { margin-top: 28px; font-size: 12px; color: var(--n600); line-height: 1.6; }

@media print {
  @page { size: A4; margin: 12mm; }
  html, body { background: #fff !important; font-size: 12px; }
  body.has-tray { padding-bottom: 0; }
  .screen, .tray, .scrim { display: none !important; }
  .doc { display: block !important; margin: 0 !important; }
  .doc .paper { border: 0; padding: 0; box-shadow: none; border-radius: 0; }
  .doc .dpage { break-before: page; }
  .doc .dpage:first-child { break-before: auto; }
  .doc .dpage + .dpage { margin-top: 0; padding-top: 0; border-top: 0; }
  .doc .cblock, .doc .mini, .doc tr, .doc .stepc { break-inside: avoid; }
  .doc h2, .doc h3 { break-after: avoid; }
  thead { display: table-header-group; }
  .stepc { padding: 10px; }
}
</style>

const BAC_OPTIONS = [1, 2, 3];
const BAC_BASE = 2;

function bacEligible(specs) {
  const r = (specs.find(x => x[0] === 'Reconstitution') || [])[1] || '';
  return /^(All vials: )?2\.0ml bac water/.test(r);
}

function fmtUnits(u) {
  if (u >= 10) return String(Math.round(u));
  const r = Math.round(u * 10) / 10;
  return (r % 1 === 0) ? String(r) : r.toFixed(1);
}
function fmtMl(ml) {
  if (ml >= 0.1) return ml.toFixed(2);
  return String(parseFloat(ml.toFixed(3)));
}
function toBase(n, unit) {
  unit = unit.toLowerCase();
  if (unit === 'mcg') return { v: n / 1000, u: 'mg' };
  if (unit === 'iu') return { v: n, u: 'iu' };
  return { v: n, u: 'mg' };
}
function parseAmounts(str) {
  const m = String(str).replace(/,/g, '').match(/([\d.]+)(?:\s*[–-]\s*([\d.]+))?\s*(mcg|mg|IU)\b/i);
  if (!m) return null;
  const a = toBase(parseFloat(m[1]), m[3]);
  const out = { u: a.u, vals: [a.v] };
  if (m[2]) out.vals.push(toBase(parseFloat(m[2]), m[3]).v);
  return out;
}
const DRAW_RE = /^([\d.]+)(?:[–-]([\d.]+))? units · ([\d.]+)(?:[–-]([\d.]+))?ml$/;

// Per-injection dose for a row: an "Xmg × N injections" cell wins, else the first cell with an amount.
function rowDose(row) {
  for (let i = 1; i < row.length; i++) {
    const m = String(row[i]).match(/([\d.]+)\s*(mcg|mg|IU)\s*×\s*\d+\s*injections/i);
    if (m) { const a = toBase(parseFloat(m[1]), m[2]); return { u: a.u, vals: [a.v] }; }
  }
  for (let i = 1; i < row.length; i++) {
    if (DRAW_RE.test(row[i])) continue;
    const a = parseAmounts(row[i]);
    if (a) return a;
  }
  return null;
}

// Rescale a 2ml draw table to w ml of bac water.
function scaleTable(t, w, vialSpec) {
  if (w === BAC_BASE) return t;
  const f = w / BAC_BASE;
  const nCols = t.headers.length;
  const colC = {};
  for (let c = 0; c < nCols; c++) {
    let best = null;
    t.rows.forEach(r => {
      const m = String(r[c]).match(DRAW_RE); if (!m) return;
      const d = rowDose(r); if (!d) return;
      const units = parseFloat(m[2] || m[1]);
      const dose = d.vals[d.vals.length - 1];
      if (dose > 0 && (!best || units > best.units)) best = { units, c: units / dose, u: d.u };
    });
    if (!best) continue;
    // Prefer the exact vial strength when the header or spec names it and it agrees with the table.
    const hv = parseAmounts((String(t.headers[c]).match(/\(([^)]*vial)\)/) || [])[1] || '') || parseAmounts(vialSpec || '');
    if (hv && hv.u === best.u && hv.vals[0] > 0) {
      const exact = 100 * BAC_BASE / hv.vals[0];
      if (Math.abs(exact - best.c) / exact < 0.1) best.c = exact;
    }
    colC[c] = best;
  }
  const rows = t.rows.map(r => r.map((cell, c) => {
    const m = String(cell).match(DRAW_RE);
    if (!m) return cell;
    const d = rowDose(r);
    const k = colC[c];
    let us;
    if (k && d && d.u === k.u) {
      const nums = (m[2] && d.vals.length === 2) ? d.vals : [d.vals[d.vals.length - 1]];
      us = nums.map(v => v * k.c * f);
    } else {
      us = [parseFloat(m[1])].concat(m[2] ? [parseFloat(m[2])] : []).map(v => v * f);
    }
    const shown = us.map(fmtUnits);
    const uStr = shown.join('–');
    const mlStr = shown.map(u => fmtMl(parseFloat(u) / 100)).join('–');
    return uStr + (uStr === '1' ? ' unit · ' : ' units · ') + mlStr + 'ml';
  }));
  return { headers: t.headers, rows };
}

function scaleSpec(label, value, w) {
  if (label !== 'Reconstitution' || w === BAC_BASE) return value;
  return value
    .replace(/2\.0ml bac water/, w.toFixed(1) + 'ml bac water')
    .replace(/· 200 units/, '· ' + (w * 100) + ' units')
    .replace(/([\d,]+)IU\/ml/, (all, n) => Math.round(parseFloat(n.replace(/,/g, '')) * BAC_BASE / w) + 'IU/ml');
}

function num(s) {
  if (s === null || s === undefined) return null;
  const v = parseFloat(String(s).replace(/,/g, '').replace(/\s/g, ''));
  return isFinite(v) ? v : null;
}

function trimNum(v, dp) {
  return String(parseFloat(v.toFixed(dp)));
}

// Display an amount: mg below 0.1 shows as mcg; IU as whole numbers.
function fmtAmt(v, u) {
  if (v === null || v === undefined || !isFinite(v)) return '—';
  if (u === 'iu') return Math.round(v).toLocaleString('en-AU') + 'IU';
  if (v > 0 && v < 0.1) return trimNum(v * 1000, 1) + 'mcg';
  return trimNum(v, 3) + 'mg';
}

function drawText(units) {
  if (units === null || !isFinite(units)) return '—';
  const shown = fmtUnits(units);
  return shown + (shown === '1' ? ' unit · ' : ' units · ') + fmtMl(parseFloat(shown) / 100) + 'ml';
}

function parseWeekRange(label) {
  const s = String(label);
  let m = s.match(/(\d+)\s*[–-]\s*(\d+)/);
  if (m) return [parseInt(m[1], 10), parseInt(m[2], 10)];
  m = s.match(/(\d+)\s*\+/);
  if (m) return [parseInt(m[1], 10), Infinity];
  m = s.match(/^\s*(\d+)\s*$/);
  if (m) return [parseInt(m[1], 10), parseInt(m[1], 10)];
  return null;
}

// Which table row applies in a given week (1-based)?
function rowIndexForWeek(rows, wk) {
  let lastBefore = -1, anyParsed = false;
  for (let i = 0; i < rows.length; i++) {
    const r = parseWeekRange(rows[i][0]);
    if (!r) continue;
    anyParsed = true;
    if (wk >= r[0] && wk <= r[1]) return i;
    if (r[1] < wk) lastBefore = i;
  }
  if (!anyParsed) return 0;
  return Math.min(lastBefore + 1, rows.length - 1);
}

function specOf(p, k) {
  const s = p.specs.find(x => x[0] === k);

function isOral(p) { return ORAL_IDS.indexOf(p.id) > -1 || !!specOf(p, 'Form'); }

function vialStrength(p, idx) {
  const txt = p.sizes ? p.sizes[Math.min(idx, p.sizes.length - 1)] : (specOf(p, 'Vial') || '');
  const a = parseAmounts(txt);
  return a ? { v: a.vals[0], u: a.u } : null;
}

function listedWater(p, bac) {
  if (bacEligible(p.specs)) return bac || BAC_BASE;
  const m = specOf(p, 'Reconstitution').match(/([\d.]+)ml/);
  return m ? parseFloat(m[1]) : null;
}

function concText(vial, water) {
  if (!vial || !water) return '';
  const perMl = vial.v / water;
  const per10 = perMl / 10;
  return fmtAmt(perMl, vial.u) + ' per ml · 10 units = ' + fmtAmt(per10, vial.u);
}

function freqForCount(n) {
  const best = FREQS.reduce((a, f) => Math.abs(f.n - n) < Math.abs(a.n - n) ? f : a, FREQS[0]);
  return best.v;
}

// Best-effort conversion of a listed table into weekly-dose steps (used to prefill
// "my own titration" and to estimate how long a vial lasts).
function listedSteps(p, idx) {
  const t = p.tables[Math.min(idx, p.tables.length - 1)];
  const sch = SCHEDULE_MAP[p.id] || ['am', '', [0, 1, 2, 3, 4, 5, 6]];
  const baseN = sch[0] === 'ampm' ? 14 : sch[2].length;
  const weeklyCol = t.headers.findIndex(h => /weekly dose/i.test(h));
  const steps = [];
  t.rows.forEach(r => {
    let n = baseN, weekly = null, unit = 'mg';
    const joined = r.join(' | ');
    let m = joined.match(/×\s*(\d+)\s*injections/i);
    if (m) n = parseInt(m[1], 10);
    m = joined.match(/×\s*(\d+)\s*\/\s*week/i);
    if (m) n = parseInt(m[1], 10);
    m = joined.match(/×\s*(\d+)\s*\/\s*day/i);
    if (m) n = parseInt(m[1], 10) * 7;
    if (weeklyCol > -1 && !/×\s*\d+\s*injections/i.test(joined)) {
      const a = parseAmounts(r[weeklyCol]);
      if (a) { weekly = a.vals[0]; unit = a.u; }
    }
    if (weeklyCol > -1 && weekly === null) {
      const a = parseAmounts(r[weeklyCol]);
      if (a) { weekly = a.vals[0]; unit = a.u; }
    }
    if (weekly === null) {
      const d = rowDose(r);
      if (d) { weekly = d.vals[0] * n; unit = d.u; }
    }
    const wr = parseWeekRange(r[0]);
    const weeks = wr && isFinite(wr[1]) ? String(wr[1] - wr[0] + 1) : '';
    steps.push({ weeks, weekly: weekly === null ? '' : trimNum(weekly, 4), freq: freqForCount(n), unit, label: r[0] });
  });
  return steps;
}

    else {
      start = wk;
      if (n > 0) { end = wk + n - 1; label = start === end ? 'Week ' + start : 'Weeks ' + start + '–' + end; wk += n; }
      else { label = 'Week ' + start + '+'; open = true; }
    }
    if (n > 0 && weekly > 0) total += n * weekly; else allDefined = false;
    let warn = '';
    if (units !== null && units > 100) warn = 'More than one full 1ml syringe. Split it into two draws or use less bac water.';
    else if (units !== null && units > 0 && units < 2) warn = 'A very small draw is hard to measure. Add more bac water so each dose is bigger.';
    return {
      i, label, start, end, freq: f, weekly, per, units,
      weeklyText: weekly > 0 ? fmtAmt(weekly, unit) + ' / week' : '—',
      perText: per !== null ? fmtAmt(per, unit) : '—',
      draw: drawText(units), warn,
      vialWeeks: weekly > 0 && vial > 0 ? vial / weekly : null
    };
  });
  const firstW = rows.find(r => r.vialWeeks);
  const lastW = [...rows].reverse().find(r => r.vialWeeks);
  return {
    unit, vial, water, perMl, rows,
    conc: perMl ? fmtAmt(perMl, unit) + ' per ml · 10 units = ' + fmtAmt(perMl / 10, unit) : '',
    vialsNeeded: allDefined && vial > 0 && rows.length ? Math.ceil(total / vial - 1e-9) : null,
    totalWeeks: allDefined ? wk - 1 : null,
    vialStart: firstW ? firstW.vialWeeks : null,
    vialTop: lastW ? lastW.vialWeeks : null
  };
}

function rowForWeekCustom(ladder, wk) {
  const rows = ladder.rows;
  for (const r of rows) {
    if (r.start === null) continue;
    if (wk >= r.start && (r.end === null || wk <= r.end)) return r;
  }
  return rows.length ? rows[rows.length - 1] : null;
}

function weeksText(w) {
  if (w === null || !isFinite(w)) return '';
  if (w < 1) return 'under a week';
  const r = Math.round(w * 2) / 2;
  return (r % 1 === 0 ? r : r.toFixed(1)) + (r === 1 ? ' week' : ' weeks');
}

function encodePlan(obj) {
  const json = JSON.stringify(obj);
  const b64 = btoa(unescape(encodeURIComponent(json)));
  return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function decodePlan(s) {
  let b64 = s.replace(/-/g, '+').replace(/_/g, '/');
  while (b64.length % 4) b64 += '=';
  return JSON.parse(decodeURIComponent(escape(atob(b64))));
}

function parseCodes(str) {

    if (m) out[m[1].toUpperCase()] = { fixed: m[2] === '$', value: parseFloat(m[3]), min: m[4] ? parseInt(m[4], 10) : 0 };
  });
  return out;
}

  const wasN = (p.was && p.was[n]) || 0;

  return { n, qty, price: money(p.prices[n]), was: onSale ? money(wasN) : '', label: n === 1 ? '1 vial' : n + ' vials',
    each: n > 1 ? money(Math.round(p.prices[n] / n)) + ' each' : '', saveAmt: saveAmt > 0 ? 'Save ' + money(saveAmt) : '',
    badge: onSale ? '−' + Math.round((1 - p.prices[n] / wasN) * 100) + '%' : (save >= 5 ? 'Save ' + save + '%' : '') };
}

function ShipCountdown() {
  const [now, setNow] = useState(Date.now());
  useEffect(() => { const t = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(t); }, []);
  const cutoff = new Date(now); cutoff.setHours(14, 0, 0, 0);
  const ms = cutoff - now;
  if (ms <= 0) return html`<span>Same-day dispatch before 2pm. Orders now ship next business day.</span>`;
  const h = Math.floor(ms / 3600000), m = Math.floor((ms % 3600000) / 60000), s = Math.floor((ms % 60000) / 1000);
  return html`<span>Same-day dispatch: order within <b style="font-variant-numeric:tabular-nums">${(h ? h + 'h ' : '') + m + 'm' + (h ? '' : ' ' + s + 's')}</b></span>`;
}

// Offer to turn one or two single vials into a 3-pack when that saves money.
function packOffer(p, cart) {
  const q1 = cart[p.sku + ':1'] || 0;
  if (!p.prices[3] || q1 < 1 || q1 > 2) return null;
  const save = p.prices[1] * 3 - p.prices[3]; const extra = p.prices[3] - p.prices[1] * q1;
  return save > 0 && extra > 0 ? { q1, save, extra } : null;
}
function PackNudge({ p, sh, bump, dark }) {
  const of = packOffer(p, sh.cart);
  if (!of) return null;
  return html`<button type="button" class=${'nudge' + (dark ? ' dark' : '')} onClick=${() => { bump(p.sku + ':1', -of.q1); bump(p.sku + ':3', 1); }}>
    <span><b>Make it a 3-pack</b> for ${money(of.extra)} more</span><i>Save ${money(of.save)}</i></button>`;
}
function bestTier(p) {
  const ts = TIERS.filter(n => n > 1 && p.prices[n]);
  return ts.length ? ts.reduce((a, n) => p.prices[n] / n < p.prices[a] / a ? n : a, ts[0]) : 0;
}

function Tiers({ p, sh, bump, compact }) {
  const tiers = TIERS.filter(n => p.prices[n]); const bestN = compact ? 0 : bestTier(p);
  return html`<div class="tiers" style=${'grid-template-columns:repeat(' + tiers.length + ',minmax(0,1fr))'}>${tiers.map(n => {
    const key = p.sku + ':' + n; const t = tierInfo(p, n, sh.cart[key] || 0);
    return t.qty ? html`<div class="tier on" role="group" aria-label=${t.label + ' of ' + p.name + ', ' + t.qty + ' in your order'}>

      </div>`
      : html`<button type="button" class=${'tier' + (n === bestN ? ' best' : '')} aria-label=${'Add ' + t.label + ' of ' + p.name + ', ' + t.price + (n === bestN ? ', best value' : '')} onClick=${() => bump(key, 1)}>

      </button>`;
  })}</div>`;
}

function groupProducts(list) {
  const groups = [], by = {};
  list.forEach(p => { const [base, strength] = splitName(p.name); const k = strength ? base + '|' + p.goal : p.sku;
    if (!by[k]) { by[k] = { key: k, base: strength ? base : p.name, goal: p.goal, items: [] }; groups.push(by[k]); }
    by[k].items.push({ p, strength }); });
  return groups;
}

function TopSellers({ groups, current, pick, sh, onOpen }) {

  const step = dir => { const el = ref.current; if (!el) return; const card = el.querySelector('.pcard'); const w = card ? card.getBoundingClientRect().width + 14 : 240;

const fmtLong = d => d.toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const initials = s => { const w = String(s || '').trim().split(/\s+/).filter(x => /^[A-Za-z]/.test(x)); if (!w.length) return '?'; return (w.length > 1 ? w[0][0] + w[1][0] : w[0].slice(0, 2)).replace(/^./, c => c.toUpperCase()); };
const unitsOf = draw => { const m = String(draw).match(/^([\d.]+)/); return m && /units?/.test(draw) ? parseFloat(m[1]) : null; };
const shortDraw = draw => { const u = unitsOf(draw); if (u === null) return String(draw).replace(/ capsules?/, ' cap').replace(' daily', ''); const m = String(draw).match(/^([\d.]+(?:[–-][\d.]+)?)/); return (m ? m[1] : u) + 'u'; };

const PERSIST = ['sizeIdx', 'bac', 'order', 'customs', 'own', 'mode', 'nextId', 'client', 'by', 'start', 'notes', 'inotes', 'planId', 'cartAdded'];

function planPayload(st) {
  return {
    v: 2, id: st.planId, n: st.client, b: st.by, d: st.start, t: st.notes, o: st.inotes,
    i: st.order.map(k => st.customs[k] ? ['c', st.customs[k]] : [k, st.sizeIdx[k] || 0, st.bac[k] || 2, st.mode[k] === 'own' ? st.own[k] : 0])
  };
}

function stateFromPayload(p) {
  const s = { order: [], customs: {}, own: {}, mode: {}, sizeIdx: {}, bac: {}, client: p.n || '', by: p.b || '', start: p.d || '', notes: p.t || '', inotes: p.o || {}, planId: p.id || '' };
  let next = 1;
  (p.i || []).forEach(e => {
    if (e[0] === 'c' && e[1]) { const m = e[1]; s.customs[m.id] = m; s.order.push(m.id); next = Math.max(next, (parseInt(String(m.id).slice(1), 10) || 0) + 1); return; }
    const [id, idx, bac, own] = e;
    if (!PRODUCT[id]) return;
    s.order.push(id); s.sizeIdx[id] = idx || 0; s.bac[id] = bac || 2;
    if (own) { s.own[id] = own; s.mode[id] = 'own'; }
  });
  s.nextId = next;
  return s;
}

function legacyFromHash(h) {
  const params = new URLSearchParams(h);
  const p = params.get('p');
  if (!p) return null;
  const s = { order: [], sizeIdx: {}, bac: {}, client: params.get('n') || '' };
  p.split(',').forEach(tok => {
    const b = tok.split(':');
    if (!PRODUCT[b[0]]) return;
    s.order.push(b[0]);
    if (b[1]) s.sizeIdx[b[0]] = parseInt(b[1], 10) || 0;
    const w = parseInt(b[2], 10); if (BAC_OPTIONS.indexOf(w) > -1) s.bac[b[0]] = w;
  });
  return s.order.length ? s : null;
}

function loadState() {
  const st = defaultState();
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { const saved = JSON.parse(raw); PERSIST.forEach(k => { if (saved[k] !== undefined) st[k] = saved[k]; }); }
  } catch (e) {}
  try {
    const h = (location.hash || '').replace(/^#/, '');
    if (h.startsWith('plan=')) { Object.assign(st, stateFromPayload(decodePlan(h.slice(5))), { shared: true }); }
    else { const leg = legacyFromHash(h); if (leg) Object.assign(st, defaultState(), leg, { shared: true }); }
  } catch (e) {}
  if (!st.planId) st.planId = Math.random().toString(36).slice(2, 10);
  return st;
}

function view(p, st) {
  const idx = st.sizeIdx[p.id] || 0;
  const raw = p.tables[Math.min(idx, p.tables.length - 1)];
  const can = bacEligible(p.specs);
  const w = can ? (st.bac[p.id] || BAC_BASE) : BAC_BASE;
  const vialSpec = p.sizes ? p.sizes[Math.min(idx, p.sizes.length - 1)] : specOf(p, 'Vial');
  return { idx, can, w, t: scaleTable(raw, w, vialSpec), specs: p.specs.map(s => [s[0], scaleSpec(s[0], s[1], w)]) };
}

function customItem(key, m, p) {
  const L = computeLadder(m);
  const first = L.rows[0];
  const freqs = [...new Set(L.rows.map(r => r.freq.v))];
  const name = p ? p.name : (m.name || 'Custom compound');
  return {
    key, kind: p ? 'own' : 'custom', p, model: m, ladder: L,
    name, sub: p ? p.sub : 'Custom compound', goal: p ? p.goal : 'custom', icon: p ? GOAL_ICONS[p.goal] : null,
    desc: p ? p.desc : '', oral: false,
    vialLabel: 'Vial', vial: L.vial ? fmtAmt(L.vial, L.unit) : '—', water: L.water, conc: L.conc,
    when: m.when || 'any', whenLabel: WHEN_LABEL[m.when] || 'Any time',
    freqText: first ? first.freq.label + (freqs.length > 1 ? ', changing by phase' : '') : '—',
    site: m.site || SITES[0], duration: L.totalWeeks ? L.totalWeeks + ' weeks' : (p ? specOf(p, 'Duration') : 'Ongoing'),
    headers: ['Weeks', 'Weekly dose', 'Per injection', 'How often', 'Draw'],
    tableRows: L.rows.map(r => [r.label, r.weeklyText, r.perText, r.freq.label, r.draw]),
    rows: L.rows.map(r => ({ label: r.label, dose: r.weeklyText, extra: r.perText + ' per injection · ' + r.freq.label.toLowerCase(), draw: r.draw, units: r.units, warn: r.warn })),
    note: p ? (p.note || '') : '',
    prep: L.water ? 'Add ' + trimNum(L.water, 2) + 'ml bac water' : '',
    vialStart: L.vialStart, vialTop: L.vialTop, vialsNeeded: L.vialsNeeded,
    week: wk => {
      const r = rowForWeekCustom(L, wk);
      if (!r) return null;
      return { dose: r.perText, weeklyText: r.weeklyText, draw: r.draw, weekly: r.weekly, perAmt: r.per, days: r.freq.days, perDay: r.freq.perDay || 1, n: r.freq.n };
    }
  };
}

function listedItem(p, st) {
  if (st.mode[p.id] === 'own' && st.own[p.id]) return customItem(p.id, st.own[p.id], p);
  const v = view(p, st);
  const oral = isOral(p);
  const vs = vialStrength(p, v.idx);
  const water = oral ? null : listedWater(p, st.bac[p.id]);
  const sch = SCHEDULE_MAP[p.id] || ['any', 'See protocol card', [0, 1, 2, 3, 4, 5, 6]];
  const steps = oral ? [] : listedSteps(p, v.idx);
  const weeklyHead = /weekly/i.test(v.t.headers[1] || '');
  const rows = v.t.rows.map(r => {
    const draw = r[r.length - 1];
    const units = unitsOf(draw);
    let warn = '';
    if (units !== null && units > 100) warn = 'More than one 1ml syringe. Split into two draws, use less bac water or a stronger vial.';
    return { label: r[0], dose: r[1] + (weeklyHead ? ' / week' : ''), extra: r.slice(2, -1).join(' · '), draw, units, warn };
  });
  const st0 = steps[0], stN = steps[steps.length - 1];
  const vw = s => s && vs && num(s.weekly) > 0 && s.unit === vs.u ? vs.v / num(s.weekly) : null;
  return {
    key: p.id, kind: 'listed', p, name: p.name, sub: p.sub, goal: p.goal, icon: GOAL_ICONS[p.goal], desc: p.desc, oral,
    vialLabel: oral ? 'Form' : 'Vial', vial: oral ? (specOf(p, 'Strength') || specOf(p, 'Form')) : (vs ? fmtAmt(vs.v, vs.u) : ''),
    water, conc: oral ? '' : concText(vs, water),
    when: sch[0], whenLabel: WHEN_LABEL[sch[0]] || 'Any time', freqText: sch[1],
    site: oral ? 'Oral' : (specOf(p, 'Site') || 'SubQ · abdomen'), timing: specOf(p, 'Timing'), duration: specOf(p, 'Duration'),
    headers: v.t.headers, tableRows: v.t.rows, rows, note: p.note || '', specs: v.specs,
    prep: oral ? 'No mixing — ' + (specOf(p, 'Form') || 'oral').toLowerCase() : (water ? 'Add ' + trimNum(water, 2) + 'ml bac water' : ''),
    vialStart: vw(st0), vialTop: vw(stN), vialsNeeded: null, sizeIdx: v.idx, bacOk: v.can, bac: v.w,
    week: wk => {
      const ri = rowIndexForWeek(v.t.rows, wk);
      const r = v.t.rows[ri];
      const s = steps[ri];
      const f = s ? FREQ[s.freq] : null;
      const days = f ? f.days : sch[2];
      const d = rowDose(r);
      const dose = d ? d.vals.map(x => fmtAmt(x, d.u)).join('–') : r[1];
      const perAmt = d && vs && d.u === vs.u ? d.vals[0] : null;
      return { dose, weeklyText: r[1], draw: r[r.length - 1], weekly: s ? num(s.weekly) : null, unit: s ? s.unit : null, perAmt, days, perDay: f ? (f.perDay || 1) : (sch[0] === 'ampm' ? 2 : 1), n: f ? f.n : days.length };
    }
  };
}

function Calculator({ st, set }) {
  const c = st.calc;
  const up = patch => set(s => ({ calc: Object.assign({}, s.calc, patch) }));
  const strength = num(c.strength), water = num(c.water), dose = num(c.dose);
  const valid = strength > 0 && water > 0 && dose > 0;
  const conc = valid ? strength / water : 0;
  const units = valid ? dose / conc * 100 : null;
  return html`<div class="calc" id="calc">
    <div class="stack g16">
      <div><h3 style="font-size:24px">Dose calculator</h3><p class="small muted" style="margin-top:4px">Enter the vial strength, the water you added and your dose. Use the same unit (mg or IU) for strength and dose.</p></div>
      <label class="field"><span>Vial strength (mg or IU)</span><input class="input" inputmode="decimal" value=${c.strength} onInput=${e => up({ strength: e.target.value })} placeholder="10" /></label>
      <div class="field"><span>Bac water added (ml)</span>
        <div class="row g8 wrapx">${BAC_OPTIONS.map(v => html`<button type="button" class="pill" aria-pressed=${String(num(c.water) === v)} onClick=${() => up({ water: String(v) })}>${v}ml</button>`)}
          <input class="input" style="width:110px" inputmode="decimal" aria-label="Other water volume in ml" value=${c.water} onInput=${e => up({ water: e.target.value })} /></div></div>
      <label class="field"><span>Your dose (mg or IU)</span><input class="input" inputmode="decimal" value=${c.dose} onInput=${e => up({ dose: e.target.value })} placeholder="0.25" /><small>Working in mcg? Divide by 1,000: 250mcg is 0.25mg.</small></label>
    </div>
    <div class="out">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px">
        <div><div class="lbl">Units to draw</div><div class="big">${valid ? fmtUnits(units) : '—'}</div></div>
        <div><div class="lbl">Volume</div><div class="big">${valid ? fmtMl(parseFloat(fmtUnits(units)) / 100) + 'ml' : '—'}</div></div>
        <div><div class="lbl">Concentration</div><div style="font-size:17px;font-weight:600;color:var(--ink)">${valid ? trimNum(conc, 3) + ' per ml' : '—'}</div></div>
        <div><div class="lbl">Doses per vial</div><div style="font-size:17px;font-weight:600;color:var(--ink)">${valid ? Math.floor(strength / dose + 1e-9) : '—'}</div></div>
      </div>
      <div><${Syringe} units=${units} /><div class="syr-scale"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div></div>
      <div class=${valid && units > 100 ? 'warn' : 'small muted'}>${valid ? (units > 100 ? 'That is more than one full 1ml syringe. Split it into two draws or use less bac water.' : units < 2 ? 'That is a tiny draw and hard to measure accurately. Add more bac water so each dose is bigger.' : 'Draw to the ' + fmtUnits(units) + ' unit mark on a 1ml (100 unit) insulin syringe.') : 'Enter all three values to see the units to draw.'}</div>
    </div>
  </div>`;
}

}

function Guide({ st, set, chapter }) {
  const ci = Math.max(0, CHAPTERS.findIndex(c => c.key === chapter));
  const ch = CHAPTERS[ci];
  const go = i => { location.hash = '#/guide/' + CHAPTERS[i].key; };
  useEffect(() => { const el = document.querySelector('.chap-nav [aria-current="step"]'); if (el && el.scrollIntoView) el.scrollIntoView({ inline: 'center', block: 'nearest' }); }, [ci]);
  return html`<div class="wrap page">
    <div class="page-head"><h1>Get it right the first time</h1></div>
    <div class="chap-nav" role="tablist" aria-label="Guide chapters">${CHAPTERS.map((c, i) => html`<button type="button" role="tab" aria-selected=${String(i === ci)} aria-current=${i === ci ? 'step' : null} onClick=${() => go(i)}><span class="n">${i + 1}</span>${c.title}</button>`)}</div>
    <div class="progress" aria-hidden="true"><div style=${'width:' + ((ci + 1) / CHAPTERS.length * 100) + '%'}></div></div>
    <div role="tabpanel" aria-label=${ch.title}>
      <h3 style="font-size:clamp(24px,5vw,30px)">${ch.h}</h3><p class="muted" style="margin:6px 0 16px;max-width:62ch">${ch.p}</p>
      ${ch.key === 'mix' ? html`<div class="steps">${STEPS.map(s => html`<div class="stepc"><span class="n">${s.n}</span><div><h4>${s.title}</h4><p class="small">${s.body}</p><div class="tip">${s.tip}</div></div></div>`)}</div><${GlassVisual} />` : null}
      ${ch.key === 'measure' ? html`<${SyringeReading} /><${Calculator} st=${st} set=${set} />` : null}
      ${ch.key === 'inject' ? html`<${AngleVisual} /><${TCards} items=${TABS.technique} /><${NeedleVisual} /><${TCards} items=${TABS.types} />` : null}
      ${ch.key === 'sites' ? html`<${BodyMap} st=${st} set=${set} bare />` : null}
      ${ch.key === 'store' ? html`<${TCards} items=${STORAGE} />` : null}
      ${ch.key === 'faq' ? html`<${SuppliesFaq} bare />` : null}
    </div>
    <div class="chap-foot">
      <button type="button" class="btn outline" disabled=${ci === 0} onClick=${() => go(ci - 1)}><${Icon} name="back" size=${16} /> Back</button>
      ${ci < CHAPTERS.length - 1 ? html`<button type="button" class="btn" onClick=${() => go(ci + 1)}>Next: ${CHAPTERS[ci + 1].title} <${Icon} name="arrow" size=${16} /></button>`
        : html`<a class="btn" href="#/">Back to the price list</a>`}
    </div>
  </div>`;
}

function SuppliesFaq({ bare }) {

function TitrationEditor({ m, onChange }) {
  const L = computeLadder(m);
  const unitLbl = m.unit === 'iu' ? 'IU' : 'mg';
  const setStep = (i, patch) => onChange({ steps: m.steps.map((s, j) => j === i ? Object.assign({}, s, patch) : s) });
  const addStep = () => { const last = m.steps[m.steps.length - 1] || { weeks: '4', weekly: '', freq: '1' }; onChange({ steps: m.steps.concat([{ weeks: '4', weekly: last.weekly, freq: last.freq }]) }); };
  const delStep = i => onChange({ steps: m.steps.filter((_, j) => j !== i) });
  return html`<div class="stack g10">
    <div class="row g8" style="justify-content:space-between"><div class="lbl">Titration · weekly dose by phase</div><span class="tiny muted">${L.totalWeeks ? L.totalWeeks + ' weeks planned' : 'Last phase ongoing'}</span></div>
    ${m.steps.map((s, i) => { const r = L.rows[i]; return html`<div class="tstep">
      <div class="row g8"><b style="color:var(--ink);font-size:14px">Phase ${i + 1}</b><span class="tiny muted grow">${r ? r.label : ''}</span>
        ${m.steps.length > 1 ? html`<button type="button" class="iconbtn sm" aria-label=${'Remove phase ' + (i + 1)} onClick=${() => delStep(i)}><${Icon} name="close" size=${16} /></button>` : null}</div>
      <div class="tgrid">
        <label class="field"><span>Weeks</span><input class="input" inputmode="numeric" placeholder="Ongoing" value=${s.weeks} onInput=${e => setStep(i, { weeks: e.target.value.replace(/[^\d]/g, '') })} /></label>
        <label class="field"><span>Weekly dose (${unitLbl})</span><input class="input" inputmode="decimal" placeholder=${m.unit === 'iu' ? '1500' : '2'} value=${s.weekly} onInput=${e => setStep(i, { weekly: e.target.value })} /></label>
        <label class="field"><span>How often</span><select class="select" value=${s.freq} onChange=${e => setStep(i, { freq: e.target.value })}>${FREQS.map(f => html`<option value=${f.v}>${f.label}</option>`)}</select></label>
      </div>
      ${r && r.units !== null ? html`<div class="row g12" style="align-items:center"><div class="out grow">${r.perText} per injection · draw <b>${r.draw}</b></div></div><${Syringe} units=${r.units} small />` : html`<div class="tiny muted">Enter a weekly dose to see the draw.</div>`}
      ${r && r.warn ? html`<div class="warn">${r.warn}</div>` : null}
    </div>`; })}
    <div><button type="button" class="btn outline sm" onClick=${addStep}><${Icon} name="plus" size=${16} /> Add phase</button></div>
  </div>`;
}

    </div></div>

}

// ================= Export document (screen preview + print/PDF) =================

function weekDates(st) {
  const s = parseDay(st.start);
  return wk => Array.from({ length: 7 }, (_, i) => s ? addDays(s, (wk - 1) * 7 + i) : null);
}

function supplyPlan(items) {
  // First four weeks: injections, vials, water.
  let injections = 0, vials = 0, water = 0;
  const lines = items.map(it => {
    if (it.oral) return { it, inj: 0, vials: null };
    let inj = 0, amount = 0, amountKnown = true;
    for (let wk = 1; wk <= 4; wk++) {
      const w = it.week(wk);
      if (!w) continue;
      const n = w.days.length * (w.perDay || 1);
      inj += n;
      if (w.weekly > 0) amount += w.weekly; else amountKnown = false;
    }
    const vialAmt = it.kind === 'listed' ? (vialStrength(it.p, it.sizeIdx || 0) || {}).v : num(it.model && it.model.vial);
    const nv = amountKnown && vialAmt > 0 ? Math.max(1, Math.ceil(amount / vialAmt - 1e-9)) : 1;
    injections += inj; vials += nv; water += nv * (it.water || 0);
    return { it, inj, vials: nv };
  });
  return { lines, injections, vials, water, syringes: injections + vials, swabs: injections + vials * 2 };
}

}

// ================= Daily tracker, hero, box section, header, footer, root =================

const ROTATION = ['Abdomen 1', 'Abdomen 2', 'Abdomen 3', 'Abdomen 4', 'Abdomen 5', 'Abdomen 6', 'Abdomen 7', 'Abdomen 8', 'Left flank', 'Right flank', 'Left thigh', 'Right thigh'];
const BUCKET_ORDER = ['am', 'ampm', 'pre', 'any', 'pm', 'weekly'];
const trackKey = id => 'wpda-track-' + id;
function loadTrack(id) { try { const t = JSON.parse(localStorage.getItem(trackKey(id))); if (t && t.logs) return t; } catch (e) {} return { logs: {}, mixed: {}, rot: 0, notes: {} }; }

function dosesOn(items, start, date) {
  const di = daysBetween(start, date);
  if (di < 0) return [];
  const wk = Math.floor(di / 7) + 1, dow = di % 7;
  const out = [];
  items.forEach(it => {
    const w = it.week(wk);
    if (!w || w.days.indexOf(dow) === -1) return;
    const n = w.perDay || 1;
    for (let s = 0; s < n; s++) {
      out.push({ id: it.key + ':' + s, it, w, slot: n > 1 ? (s ? 'Evening' : 'Morning') : it.whenLabel, bucket: n > 1 ? (s ? 'pm' : 'am') : it.when, units: unitsOf(w.draw) });
    }
  });
  return out.sort((a, b) => BUCKET_ORDER.indexOf(a.bucket) - BUCKET_ORDER.indexOf(b.bucket));
}

function Ring({ done, total }) {
  const r = 36, C = 2 * Math.PI * r, pct = total ? done / total : 0;
  return html`<div style="position:relative;width:96px;height:96px;flex:none" role="img" aria-label=${done + ' of ' + total + ' doses done today'}>
    <svg viewBox="0 0 84 84" style="width:100%;height:100%;transform:rotate(-90deg)"><circle cx="42" cy="42" r=${r} fill="none" stroke="rgba(34,35,38,.12)" stroke-width="7" /><circle cx="42" cy="42" r=${r} fill="none" stroke="#222326" stroke-width="7" stroke-linecap="round" stroke-dasharray=${(C * pct).toFixed(1) + ' ' + C.toFixed(1)} /></svg>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1"><b style="font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums">${done}<span style="font-size:13px;color:var(--n600)">/${total}</span></b><span style="font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--n600);margin-top:3px">done</span></div>
  </div>`;
}

function Tracker({ st, set, items, onReorder }) {
  const [tr, setTr] = useState(() => loadTrack(st.planId));
  const [dayOff, setDayOff] = useState(0);
  useEffect(() => { setTr(loadTrack(st.planId)); }, [st.planId]);
  const saveTr = next => { setTr(next); try { localStorage.setItem(trackKey(st.planId), JSON.stringify(next)); } catch (e) {} };
  const start = parseDay(st.start);
  const t0 = today0();
  if (!start) {
    return html`<div><div class="banner">
      <div class="eyebrow">${st.client ? st.client.trim().split(/\s+/)[0] + "'s protocol" : 'Your protocol'}</div><h2 id="h-today" style="font-size:28px">Ready when you are</h2>
      <p class="small">Set a start date and this becomes a daily tracker: what to take today, what to draw, where to inject next and when to reorder.</p>
      <div class="row g8 wrapx"><button type="button" class="btn" onClick=${() => set({ start: isoDay(t0) })}>Start today</button>
        <label class="row g8"><span class="small" style="font-weight:600;color:var(--ink)">or pick a date</span><input class="input" style="width:auto" type="date" value=${st.start} onInput=${e => set({ start: e.target.value })} /></label></div>
    </div></div>`;
  }
  const day = addDays(t0, dayOff);
  const dk = isoDay(day);
  const di = daysBetween(start, day);
  const wk = Math.floor(Math.max(0, di) / 7) + 1;
  const doses = dosesOn(items, start, day);
  const logs = tr.logs[dk] || {};
  const done = doses.filter(d => logs[d.id]).length;
  const next = doses.find(d => !logs[d.id]);
  const suggested = ROTATION[(tr.rot || 0) % ROTATION.length];
  const log = d => {
    const L = Object.assign({}, tr.logs);
    const dayLogs = Object.assign({}, L[dk] || {});
    if (dayLogs[d.id]) { delete dayLogs[d.id]; L[dk] = dayLogs; saveTr(Object.assign({}, tr, { logs: L })); return; }
    dayLogs[d.id] = { site: d.oral || d.it.oral ? 'Oral' : suggested, amt: d.w.perAmt || 0, t: Date.now() };
    L[dk] = dayLogs;
    saveTr(Object.assign({}, tr, { logs: L, rot: d.it.oral ? tr.rot : (tr.rot || 0) + 1 }));
  };
  const setSite = (d, site) => { const L = Object.assign({}, tr.logs); L[dk] = Object.assign({}, L[dk], { [d.id]: Object.assign({}, L[dk][d.id], { site }) }); saveTr(Object.assign({}, tr, { logs: L })); };
  const strip = Array.from({ length: 7 }, (_, i) => { const d = addDays(t0, i - 3); const k = isoDay(d); const ds = dosesOn(items, start, d); const n = ds.filter(x => (tr.logs[k] || {})[x.id]).length; return { d, k, off: i - 3, total: ds.length, n }; });
  // Vial supply per injectable item
  const supply = items.filter(it => !it.oral).map(it => {
    const vialAmt = it.kind === 'listed' ? (vialStrength(it.p, it.sizeIdx || 0) || {}).v : num(it.model.vial);
    const mixedOn = tr.mixed[it.key] || st.start;
    let used = 0;
    Object.keys(tr.logs).forEach(k => { if (k >= mixedOn) Object.keys(tr.logs[k]).forEach(id => { if (id.split(':')[0] === it.key) used += tr.logs[k][id].amt || 0; }); });
    const w = it.week(wk);
    const per = w && w.perAmt;
    const left = vialAmt > 0 && per > 0 ? Math.max(0, Math.floor((vialAmt - used) / per + 1e-9)) : null;
    const age = daysBetween(parseDay(mixedOn), t0);
    return { it, vialAmt, used, left, age, pct: vialAmt > 0 ? Math.max(0, Math.min(1, 1 - used / vialAmt)) : 0, low: (left !== null && left <= 3) || age > 28 };
  });
  return html`<div>
    <div class="page-head"><div class="eyebrow">${st.client ? st.client.trim().split(/\s+/)[0] + "'s protocol" : 'Your protocol'}</div><h1 id="h-today">${di < 0 ? 'Starts ' + fmtDay(start) : dayOff === 0 ? 'Today' : fmtDay(day)}</h1>
      <p class="muted">${di < 0 ? 'Your plan starts in ' + (-di) + ' day' + (-di === 1 ? '' : 's') + '. Mix your vials the day before.' : 'Week ' + wk + ' · day ' + (di + 1) + '. Tick each dose as you take it.'}</p></div>
    <div class="banner" style="gap:16px">
      <div class="row g16"><${Ring} done=${done} total=${doses.length} />
        <div class="grow">${next ? html`<div class="lbl">Up next</div><div style="font-size:21px;font-weight:700;color:var(--ink);line-height:1.2">${next.it.name}</div><div class="small">${next.slot} · ${next.w.dose}${next.units !== null ? ' · draw ' + String(next.w.draw).split(' · ')[0] : ''}</div>${!next.it.oral ? html`<div class="tiny muted" style="margin-top:2px">Inject at: <b style="color:var(--ink)">${suggested}</b></div>` : null}`
          : html`<div class="lbl">${fmtDay(day)}</div><div style="font-size:21px;font-weight:700;color:var(--ink)">${doses.length ? 'All done' : 'Rest day'}</div><div class="small">${doses.length ? 'Every dose for the day is ticked off.' : 'Nothing scheduled. Keep vials in the fridge.'}</div>`}</div></div>
      <div class="row g4" role="group" aria-label="Choose a day">${strip.map(s => html`<button type="button" onClick=${() => setDayOff(s.off)} aria-pressed=${String(s.off === dayOff)} aria-label=${fmtDay(s.d) + ', ' + s.n + ' of ' + s.total + ' done'}
        style=${'flex:1 1 0;min-width:36px;min-height:58px;border-radius:14px;border:1px solid ' + (s.off === dayOff ? 'var(--ink)' : 'rgba(34,35,38,.12)') + ';background:' + (s.off === dayOff ? 'var(--ink)' : 'rgba(255,255,255,.7)') + ';color:' + (s.off === dayOff ? '#fff' : 'var(--ink)') + ';display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-size:11px;font-weight:600'}>
        <span>${DOW[s.d.getDay()]}</span><b style="font-size:16px;font-variant-numeric:tabular-nums">${s.d.getDate()}</b>
        <i style=${'width:6px;height:6px;border-radius:50%;background:' + (!s.total ? 'transparent' : s.n === s.total ? 'var(--ok)' : s.n ? '#ff7848' : (s.off === dayOff ? 'rgba(255,255,255,.5)' : 'var(--n300)'))}></i></button>`)}</div>
    </div>
    <div class="stack g8" style="margin-top:12px">
      ${doses.map(d => { const l = logs[d.id]; return html`<div class="card" style=${'padding:12px 14px;display:flex;gap:12px;align-items:center;' + (l ? 'background:var(--paper);border-color:var(--paper)' : '')}>
        <button type="button" onClick=${() => log(d)} aria-pressed=${String(!!l)} aria-label=${(l ? 'Undo ' : 'Log ') + d.it.name + ' ' + d.slot}
          style=${'width:40px;height:40px;flex:none;border-radius:12px;border:2px solid ' + (l ? 'var(--ink)' : 'var(--n300)') + ';background:' + (l ? 'var(--ink)' : '#fff') + ';color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer'}>${l ? html`<${Icon} name="check" size=${20} />` : null}</button>
        <div class="grow"><div style="font-weight:700;color:var(--ink)">${d.it.name}</div><div class="tiny muted">${d.slot} · ${d.w.dose}${d.units !== null ? ' · ' + d.w.draw : d.it.oral ? ' · ' + d.w.draw : ''}</div>
          ${l && !d.it.oral ? html`<label class="row g6 tiny" style="margin-top:4px"><span>Site</span><select class="select" style="min-height:32px;padding:2px 30px 2px 10px;font-size:13px;width:auto" value=${l.site} onChange=${e => setSite(d, e.target.value)}>${ROTATION.map(r => html`<option value=${r}>${r}</option>`)}</select></label>` : null}</div>
        ${d.units !== null ? html`<div style="width:96px;flex:none"><${Syringe} units=${d.units} small /></div>` : null}
      </div>`; })}
      ${!doses.length && di >= 0 ? html`<div class="empty">No doses scheduled on ${fmtDay(day)}.</div>` : null}
    </div>
    ${supply.length ? html`<h3 style="font-size:20px;margin:26px 0 10px">Vials</h3>
      <div class="cgrid">${supply.map(s => html`<div class="card" style="padding:14px 16px;display:flex;flex-direction:column;gap:8px">
        <div class="row g8"><b class="grow" style="color:var(--ink)">${s.it.name}</b><span class="tiny muted">${s.left !== null ? '≈ ' + s.left + ' dose' + (s.left === 1 ? '' : 's') + ' left' : ''}</span></div>
        <div style="height:8px;border-radius:999px;background:var(--sunken);overflow:hidden"><div style=${'height:100%;border-radius:999px;width:' + Math.round(s.pct * 100) + '%;background:' + (s.low ? 'var(--bad)' : 'var(--ink)')}></div></div>
        <div class="tiny muted">Mixed ${s.age <= 0 ? 'today' : s.age + ' day' + (s.age === 1 ? '' : 's') + ' ago'} · use within 4 weeks of mixing</div>
        ${s.low ? html`<div class="warn tiny">${s.age > 28 ? 'This vial has been mixed for over four weeks. Start a fresh one.' : 'Running low. Reorder now so you do not miss a dose.'}</div>` : null}
        <div class="row g8 wrapx"><button type="button" class="btn sm outline" onClick=${() => saveTr(Object.assign({}, tr, { mixed: Object.assign({}, tr.mixed, { [s.it.key]: dk }) }))}>I mixed a new vial</button>
          ${s.it.p && PROTOCOL_SKUS[s.it.p.id] ? html`<button type="button" class="btn sm soft" onClick=${() => onReorder(PROTOCOL_SKUS[s.it.p.id][s.it.sizeIdx || 0] || PROTOCOL_SKUS[s.it.p.id].filter(Boolean)[0])}>Reorder</button>` : null}</div>
      </div>`)}</div>` : null}
    <label class="field" style="margin-top:20px"><span>How do you feel? (energy, sleep, appetite, side effects)</span><textarea class="textarea" placeholder="Saved on this device with the day's doses." value=${(tr.notes || {})[dk] || ''} onInput=${e => saveTr(Object.assign({}, tr, { notes: Object.assign({}, tr.notes, { [dk]: e.target.value }) }))}></textarea></label>
  </div>`;
}


// ---------- Routing ----------
function parseRoute() {
  const h = location.hash || '';
  if (h.startsWith('#/p/')) { const parts = h.slice(4).split('/'); return { page: 'product', sku: decodeURIComponent(parts[0]).toUpperCase(), tab: parts[1] || '' }; }
  if (h.startsWith('#/guide')) return { page: 'guide', chapter: h.split('/')[2] || 'mix' };
  const m = h.match(/^#\/(order|plan|build|coa)$/);
  if (m) return { page: m[1] };
  return { page: 'shop' };
}

function Ticker() {
  const row = hidden => html`<div class="tk-row" aria-hidden=${hidden ? 'true' : null}>
    <span>Free express shipping over $200 AUD</span><i></i><span><${ShipCountdown} /></span><i></i>
    <span>Free bac water with every vial</span><i></i><span>Batch-matched certificate with every order</span><i></i></div>`;
  return html`<div class="ticker screen"><div class="tk-track">${row(false)}${row(true)}</div></div>`;
}

function ShopHero() {
  const best = Math.max.apply(null, SHOP_PRODUCTS.map(p => Math.max.apply(null, TIERS.filter(n => n > 1 && p.prices[n]).map(n => 1 - p.prices[n] / (p.prices[1] * n)).concat([0]))));
  return html`<section class="wrap"><div class="shero">
    <figure class="sh-photo"><img src="assets/brand/hero-box.webp" alt="Open blue optml box with two labelled vials in a fitted tray" fetchpriority="high" />
      <figcaption class="sh-pill"><img src="assets/features/save.svg" alt="" />Packs up to ${Math.floor(best * 100)}% off</figcaption></figure>
    <div class="sh-copy">
      <h1>${WHOLESALE ? 'Wholesale price list' : 'Research‑grade peptides, properly tested.'}</h1>
      <p class="lead">${WHOLESALE ? 'Your confirmed wholesale rates, boxed with bac water and a batch certificate.' : 'Boxed with free bac water and a batch certificate. Order before 2pm and it ships today.'}</p>
      <ul class="sh-feats">
        <li><a href="#/coa"><img src="assets/features/tested.svg" alt="" /><span><b>98%+ purity</b>View certificates</span></a></li>
        <li><div><img src="assets/features/auto.svg" alt="" /><span><b>Free bac water</b>In every box</span></div></li>
        <li><div><img src="assets/features/discreet.svg" alt="" /><span><b>Fast shipping</b>Tracked, discreet</span></div></li>
        <li><a href="#/guide"><img class="seal" src="assets/brand/label-circle.png" alt="" /><span><b>Dosing guide</b>For every order</span></a></li>
      </ul>
    </div>
  </div></section>`;
}

function GuideCard() {
  return html`<section class="wrap"><div class="gcard">
    <img src="assets/brand/label-circle.png" alt="World Peptide Dosage Association" />
    <div class="stack g8"><h2>Not sure how to dose or mix?</h2>
      <p>Every compound on this list has a guide: the dose week by week, mixing steps, injection sites and a daily tracker.</p></div>
    <a class="btn on-dark" href="#/guide">Open the guide</a>
  </div></section>`;
}

function AfterOrder() {
  return html`<section class="wrap" aria-labelledby="h-after"><div class="after">
    <h2 id="h-after">What happens after you order</h2>
    <ol class="flow">
      <li><b>We confirm on WhatsApp</b><span>We check stock and reply with PayID details. Nothing is charged on this page.</span></li>
      <li><b>Your box ships express</b><span>Every vial arrives with a vial of bac water to mix it, free.</span></li>
      <li><b>Your guide is ready</b><span>My plan shows what to draw, where to inject and what's due each day.</span></li>
    </ol>
  </div></section>`;
}

function Header({ route, count, total, planCount }) {
  const cur = p => (route.page === p || (p === 'shop' && route.page === 'product')) ? 'page' : null;
  const [stuck, setStuck] = useState(false);
  useEffect(() => { const on = () => setStuck(window.scrollY > 4); on(); window.addEventListener('scroll', on, { passive: true }); return () => window.removeEventListener('scroll', on); }, []);
  return html`<header class=${'top screen' + (stuck ? ' stuck' : '')}><div class="wrap inner">
    <a href="#/" aria-label="optml price list home" style="justify-self:start;display:flex;align-items:center;min-height:40px;text-decoration:none"><img class="logo" src="assets/brand/optml-wordmark-dark.svg" alt="optml" style="height:24px" /></a>
    <a class=${'btn sm plan' + (count ? '' : ' outline')} href="#/order" aria-label=${count ? 'Your order, ' + count + ' pack' + (count === 1 ? '' : 's') + ', ' + money(total) : 'Your order, empty'}>${count ? html`${money(total)}<span class="count">${count}</span>` : 'Order'}</a>
    <nav aria-label="Pages" class="desk"><a href="#/" aria-current=${cur('shop')}>Price list</a><a href="#/guide" aria-current=${cur('guide')}>How to use</a><a href="#/plan" aria-current=${cur('plan')}>My plan${planCount ? html`<i class="navdot">${planCount}</i>` : null}</a><a href="#/coa" aria-current=${cur('coa')}>Certificates</a><a href="#/build" aria-current=${cur('build')}>Build a protocol</a></nav>
  </div></header>`;
}

function TabBar({ route, count, planCount }) {
  const tabs = [['shop', '#/', 'Shop', 'shop'], ['guide', '#/guide', 'How to use', 'book'], ['plan', '#/plan', 'My plan', 'plan'], ['order', '#/order', 'Order', 'bag']];
  return html`<nav class="tabbar screen" aria-label="Pages">${tabs.map(t => { const on = route.page === t[0] || (t[0] === 'shop' && route.page === 'product');
    return html`<a href=${t[1]} aria-current=${on ? 'page' : null}><span class="ico"><${Icon} name=${t[3]} size=${23} />${t[0] === 'order' && count ? html`<i class="dot">${count}</i>` : t[0] === 'plan' && planCount ? html`<i class="dot soft">${planCount}</i>` : null}</span>${t[2]}</a>`; })}</nav>`;
}

function PlanPage({ st, set, items, onReorder }) {
  if (!items.length) return html`<div class="wrap page narrow"><div class="page-head"><h1>Your guide lives here</h1>
      <p class="lead">Add a product to your cart and its guide appears here: the units to draw, how to mix each vial, where to inject and what's due each day.</p></div>
    <div class="stack g12">
      <div class="row g8 wrapx"><a class="btn" href="#/">Browse the price list</a><a class="btn outline" href="#/build">Build a protocol yourself</a></div></div></div>`;
  return html`<div class="wrap page narrow">
    <${Tracker} st=${st} set=${set} items=${items} onReorder=${onReorder} />
    <div class="card" style="padding:16px;margin-top:22px;display:flex;flex-direction:column;gap:10px"><b style="color:var(--ink)">Your plan: ${items.map(i => i.name).join(', ')}</b>
      <div class="row g8 wrapx"><button type="button" class="btn sm" onClick=${() => window.print()}><${Icon} name="print" size=${16} /> Save my guide as PDF</button><a class="btn sm outline" href="#/build">Edit plan</a><a class="btn sm ghost" href="#/guide">How to use</a></div></div>
  </div>`;
}

function Footer() {
  return html`<footer class="foot screen"><div class="wrap" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:28px">
    <div class="stack g12"><img src="assets/brand/optml-wordmark-dark.svg" alt="optml" style="height:22px;width:auto;align-self:flex-start;filter:invert(1)" /><p>Research-grade peptides with free bac water and a batch-matched certificate. Guides by the World Peptide Dosage Association.</p></div>
    <div class="stack g8"><div class="lbl" style="color:rgba(255,255,255,.6)">Contact</div><a href=${'https://wa.me/' + WA_NUMBER} target="_blank" rel="noopener">WhatsApp</a><a href=${'mailto:' + CONTACT}>${CONTACT}</a></div>
    <div class="stack g8"><div class="lbl" style="color:rgba(255,255,255,.6)">Pages</div><a href="#/">Price list</a><a href="#/guide">How to use</a><a href="#/coa">Certificates</a><a href="#/build">Build a protocol</a></div>
    <p class="tiny" style="grid-column:1/-1;border-top:1px solid rgba(255,255,255,.14);padding-top:18px;color:rgba(255,255,255,.6)">Supplied for laboratory research use. ${DISCLAIMER}</p>
  </div></footer>`;
}

function App() {
  const [st, setSt] = useState(loadState);
  const set = patch => setSt(s => Object.assign({}, s, typeof patch === 'function' ? patch(s) : patch));
  const [sh, setShRaw] = useState(loadShop);
  const setSh = patch => setShRaw(s => Object.assign({}, s, typeof patch === 'function' ? patch(s) : patch));
  const [route, setRoute] = useState(parseRoute);
  const [ptab, setPtab] = useState('use');
  const [toast, setToast] = useState('');
  const items = planItems(st);
  const o = computeOrder(sh, Date.now());
  const [hasPrev, setHasPrev] = useState(() => { try { return !!localStorage.getItem('wpda-hub-prev'); } catch (e) { return false; } });

  useEffect(() => {
    const on = () => { setRoute(parseRoute()); setPtab('use'); window.scrollTo({ top: 0, behavior: 'instant' }); };
    window.addEventListener('hashchange', on);
    if (st.shared) {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (raw) { const prev = JSON.parse(raw); if (prev.planId && prev.planId !== st.planId && prev.order && prev.order.length) { localStorage.setItem('wpda-hub-prev', raw); setHasPrev(true); } }
      } catch (e) {}
      location.replace('#/plan');
    }
    return () => window.removeEventListener('hashchange', on);
  }, []);
  useEffect(() => { try { const x = {}; PERSIST.forEach(k => { x[k] = st[k]; }); localStorage.setItem(STORE_KEY, JSON.stringify(x)); } catch (e) {} }, PERSIST.map(k => st[k]));
  useEffect(() => { try { const x = {}; SHOP_SAVED.forEach(k => { x[k] = sh[k]; }); localStorage.setItem(SHOP_KEY, JSON.stringify(x)); } catch (e) {} }, SHOP_SAVED.map(k => sh[k]));

  // My plan follows the cart: adding a product adds its guide, taking it out again removes it.
  // Guides the customer added or removed by hand, and anything from a sent order, are left alone.
  const cartKey = Object.keys(sh.cart).filter(k => sh.cart[k] > 0).sort().join(',');
  useEffect(() => {
    const inCart = {};
    cartKey.split(',').forEach(k => { const m = SKU_PROTOCOL[k.split(':')[0]]; if (m && PRODUCT[m[0]]) (inCart[m[0]] = inCart[m[0]] || []).push(m[1]); });
    set(s => {
      const seen = Object.assign({}, s.cartAdded || {}); let order = s.order; const sizeIdx = Object.assign({}, s.sizeIdx); let changed = false;
      Object.keys(inCart).forEach(id => {
        if (!seen[id]) { if (order.indexOf(id) === -1) { order = order.concat([id]); seen[id] = 'added'; sizeIdx[id] = inCart[id][0]; } else seen[id] = 'had'; changed = true; }
        else if (seen[id] === 'added' && inCart[id].indexOf(sizeIdx[id] || 0) === -1) { sizeIdx[id] = inCart[id][0]; changed = true; }
      });
      Object.keys(seen).forEach(id => { if (inCart[id]) return; if (seen[id] === 'added') order = order.filter(x => x !== id); delete seen[id]; changed = true; });
      return changed ? { order, sizeIdx, cartAdded: seen } : {};
    });
  }, [cartKey]);

  const flash = m => { setToast(m); clearTimeout(window.__tt); window.__tt = setTimeout(() => setToast(''), 1800); };
  const bump = (key, d) => {
    setSh(s => { const cart = Object.assign({}, s.cart); cart[key] = (cart[key] || 0) + d; if (cart[key] <= 0) delete cart[key]; return { cart, sent: false }; });
    if (d > 0) { const b = key.split(':'); const p = SHOP_BY_SKU[b[0]]; if (p) flash('Added ' + p.name + ' · ' + (b[1] === '1' ? '1 vial' : b[1] + ' vials')); }
  };
  const act = {
    add: id => set(s => {
      if (id === 'stack') {
        const ids = ['reta', 'tesa', 'mots', 'klow']; const w = s.bac.stack || BAC_BASE;
        return { order: s.order.concat(ids.filter(x => s.order.indexOf(x) === -1)), sizeIdx: Object.assign({}, s.sizeIdx, { reta: 1 }), bac: Object.assign({}, s.bac, { reta: w, tesa: w, mots: w, klow: w }) };
      }
      return s.order.indexOf(id) > -1 ? { order: s.order.filter(x => x !== id) } : { order: s.order.concat([id]) };
    }),
    remove: key => set(s => { const customs = Object.assign({}, s.customs); delete customs[key]; return { order: s.order.filter(x => x !== key), customs, openItem: s.openItem === key ? null : s.openItem }; }),
    addCustom: () => {
      set(s => { const id = 'x' + s.nextId; return { customs: Object.assign({}, s.customs, { [id]: blankCustom(id) }), order: s.order.concat([id]), nextId: s.nextId + 1, openItem: id }; });
      setTimeout(() => { const el = document.querySelector('.item:last-of-type'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 60);
    },
    own: (id, on) => set(s => {
      const mode = Object.assign({}, s.mode, { [id]: on ? 'own' : 'std' });
      if (!on || s.own[id]) return { mode };
      const p = PRODUCT[id], idx = s.sizeIdx[id] || 0, vs = vialStrength(p, idx);
      const sch = SCHEDULE_MAP[id] || ['any'];
      let steps = listedSteps(p, idx);
      if (!steps.some(x => parseWeekRange(x.label))) steps = steps.slice(0, 1).map(x => Object.assign({}, x, { weeks: '' }));
      const model = { id, name: p.name, unit: vs && vs.u === 'iu' ? 'iu' : 'mg', vial: vs ? String(vs.v) : '', water: String(listedWater(p, s.bac[id]) || 2), when: sch[0], site: /thigh/i.test(specOf(p, 'Site')) ? SITES[1] : SITES[0], steps: steps.map(x => ({ weeks: x.weeks, weekly: x.weekly, freq: x.freq })) };
      return { mode, own: Object.assign({}, s.own, { [id]: model }) };
    }),
    model: (key, patch) => set(s => s.customs[key] ? { customs: Object.assign({}, s.customs, { [key]: Object.assign({}, s.customs[key], patch) }) } : { own: Object.assign({}, s.own, { [key]: Object.assign({}, s.own[key], patch) }) }),
    clear: () => set({ order: [], customs: {}, own: {}, mode: {}, inotes: {}, client: '', by: '', start: '', notes: '', shared: false, planId: Math.random().toString(36).slice(2, 10) }),
    hasPrev: hasPrev && st.shared,
    restorePrev: () => { try { const prev = JSON.parse(localStorage.getItem('wpda-hub-prev')); localStorage.removeItem('wpda-hub-prev'); setHasPrev(false); set(Object.assign({}, prev, { shared: false })); } catch (e) {} }
  };
  // After an order is sent: build "My plan" from exactly what was ordered.
  const onSent = orderItems => {
    setSh(s => ({ sent: true, lastOrder: { cart: s.cart, ref: s.ref, at: Date.now() } }));
    setTimeout(() => window.scrollTo({ top: 0, behavior: 'instant' }), 30);
    set(s => {
      const order = s.order.slice(); const sizeIdx = Object.assign({}, s.sizeIdx);
      orderItems.forEach(it => { const m = SKU_PROTOCOL[it.p.sku]; if (!m) return; if (order.indexOf(m[0]) === -1) order.push(m[0]); sizeIdx[m[0]] = m[1]; });
      const kept = {}; Object.keys(s.cartAdded || {}).forEach(id => { kept[id] = 'had'; });
      return { order, sizeIdx, client: s.client || sh.name.trim(), cartAdded: kept };
    });
  };
  const reorder = sku => { if (!sku) return; bump(sku + ':1', 1); location.hash = '#/order'; };
  const planReady = o.items.some(it => SKU_PROTOCOL[it.p.sku]);

  let page;
  if (route.page === 'product') page = html`<${ProductPage} sku=${route.sku} st=${st} set=${set} sh=${sh} bump=${bump} tab=${ptab} setTab=${setPtab} flash=${flash} />`;
  else if (route.page === 'order') page = html`<${OrderSection} sh=${sh} setSh=${setSh} bump=${bump} o=${o} onSent=${onSent} planReady=${planReady} />`;
  else if (route.page === 'guide') page = html`<${Guide} st=${st} set=${set} chapter=${route.chapter} />`;
  else if (route.page === 'plan') page = html`<${PlanPage} st=${st} set=${set} items=${items} onReorder=${reorder} />`;
  else if (route.page === 'build') page = html`<${Builder} st=${st} set=${set} items=${items} act=${act} />`;
  else if (route.page === 'coa') page = html`<${CoaSection} />`;
  else page = html`<${ShopHero} /><${ShopSection} sh=${sh} setSh=${setSh} bump=${bump} o=${o} /><${AfterOrder} /><${GuideCard} />`;

  return html`${route.page === 'shop' ? html`<${Ticker} />` : null}<${Header} route=${route} count=${o.packCount} total=${o.total} planCount=${items.length} />
    <main class="screen" id="main">${page}</main>
    <${Doc} st=${Object.assign({}, st, { preview: st.preview && route.page === 'build' })} items=${items} />
    <${Footer} />
    <${TabBar} route=${route} count=${o.packCount} planCount=${items.length} />
    ${toast ? html`<div class="toast screen" role="status">${toast}</div>` : null}`;
}

render(html`<${App} />`, document.getElementById('app'));

</script>
</body>
</html>
